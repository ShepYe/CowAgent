<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Web 知识图片隔离验证</title><link rel="stylesheet" href="/css/markdown.css"><style>body{font-family:system-ui;margin:0;padding:20px}main{max-width:880px;margin:auto}button{margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h1>Web 知识图片隔离验证</h1><button onclick="draw(false,'alpha')">当前版本</button><button onclick="draw(true,'alpha')">历史版本</button><button onclick="draw(false,'slow')">慢 Agent</button><button onclick="draw(true,'beta')">切换 Agent beta</button><p id="identity"></p><div id="body" class="markdown-content"></div><pre id="requests"></pre></main>
<script>function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function t(s){return s}</script><script src="/vendor/markdown-it/markdown-it.min.js"></script><script src="/js/core/markdown.js"></script><script>
let current = '', requests = [];
const fixture={"content": "## 端口示意\n\n![端口方向 · 原图裁区](knowledge-figure:fixture-publication/port)\n\n![损坏图片仍保留出处](knowledge-figure:fixture-publication/broken)\n\n待补图的已核验正文（待补图）〔出处 1〕", "figure_manifest": {"schema_version": 1, "items": [{"block_ordinal": 0, "figure_key": "port", "figure_id": "port", "caption": "端口方向 · 原图裁区", "state": "ready", "source": {}, "location": {"kind": "pdf", "physical_page": 3}, "source_page": 3, "source_index": 0}, {"block_ordinal": 0, "figure_key": "broken", "figure_id": "broken", "caption": "损坏图片仍保留出处", "state": "ready", "source": {}, "source_index": 0}, {"block_ordinal": 0, "figure_key": "pending", "caption": "待补图的已核验正文", "state": "pending", "source": {}, "location": {"kind": "slide", "source_slide_number": 5}, "source_page": 5, "source_index": 0}]}};
const nativeFetch=fetch.bind(window);
window.fetch=async function(input,init){const u=new URL(input,location.href);if(!u.pathname.includes('/api/knowledge/figure'))return nativeFetch(input,init);requests.push(u.href);document.getElementById('requests').textContent=requests.join('\n');if(u.pathname.endsWith('figure-original'))return new Response('isolated original');if(u.searchParams.get('figure_id')==='broken')return new Response('{}',{status:422});await new Promise(r=>setTimeout(r,u.searchParams.get('agent_id')==='slow'?2500:80));const c=document.createElement('canvas');c.width=960;c.height=520;const ctx=c.getContext('2d');ctx.fillStyle=u.searchParams.get('view')==='history'?'#ede3c3':'#d6efea';ctx.fillRect(0,0,960,520);ctx.fillStyle='#183b45';ctx.font='36px sans-serif';ctx.fillText(u.searchParams.get('view')+' · '+u.searchParams.get('agent_id'),40,100);return new Response(await new Promise(r=>c.toBlob(r)),{headers:{'Content-Type':'image/png'}})};
function draw(history,agent){const pub=history?'old-publication':'new-publication';current=pub+agent;const identity=current;const env={agentId:agent,figureView:history?'history':'current',figures:{publish_id:pub,figure_manifest:fixture.figure_manifest}};const root=document.getElementById('body');root._disposeKnowledgeFigures?.();root.innerHTML=renderMarkdown(fixture.content.split('fixture-publication').join(pub)+'\n\n![普通](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aLTsAAAAASUVORK5CYII=)',env);mountKnowledgeFigures(root,env,()=>current===identity);document.getElementById('identity').textContent=agent+' · '+pub+' · '+env.figureView;}draw(false,'alpha');
</script></html>
